<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Дашборд</title>
<style>
:root{
  --page:#eef0f4; --card:#ffffff; --text:#14181f; --hint:#6a7280; --link:#2a7fd0;
  --btn:#2a7fd0; --btnt:#ffffff; --accent:#2a7fd0; --sep:rgba(20,24,31,.09);
  --ok:#1b9a56; --warn:#c98300; --bad:#d63b3b; --idle:#8d95a3; --unk:#6a7280;
  color-scheme:light;
}
:root[data-theme=dark]{
  --page:#0f1215; --card:#1b1f24; --text:#eef0f3; --hint:#97a0ad; --link:#6ab3f3;
  --btn:#4a9be6; --btnt:#ffffff; --accent:#6ab3f3; --sep:rgba(255,255,255,.09);
  --ok:#3fcf7e; --warn:#f2b52f; --bad:#ff6b6b; --idle:#7c8594; --unk:#9aa2af;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--page); color:var(--text);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:600px;margin:0 auto;padding:0 12px 28px}
header{padding:16px 4px 10px}
h1{font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.fresh{margin-top:3px;font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.fresh.stale{color:var(--warn)}
.stalebox{
  margin:2px 0 10px;padding:10px 12px;border-radius:12px;font-size:13.5px;
  background:color-mix(in srgb,var(--warn) 16%,var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 45%,transparent);
}
.tabsbar{position:sticky;top:0;z-index:5;margin:0 -12px;padding:6px 12px 8px;background:var(--page)}
.tabs{display:flex;gap:2px;padding:3px;border-radius:11px;background:color-mix(in srgb,var(--text) 8%,transparent)}
.tabs button{
  flex:1 1 0;min-width:0;border:0;background:transparent;color:var(--hint);
  font:inherit;font-size:14px;font-weight:600;padding:7px 6px;border-radius:8px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tabs button[aria-selected=true]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section[hidden]{display:none}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px}
.note{margin:10px 4px 0;font-size:13px;color:var(--hint);overflow-wrap:anywhere}

/* status */
.hero{
  display:flex;align-items:center;gap:12px;margin-top:6px;padding:16px;border-radius:16px;
  background:color-mix(in srgb,var(--c) 15%,var(--card));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent);
}
.hero .big{flex:none;width:16px;height:16px;border-radius:50%;background:var(--c);
  box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.hero .head{font-size:21px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.rows{padding:2px 14px}
.row{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-top:1px solid var(--sep)}
.row:first-child{border-top:0}
.row .d{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c,transparent);align-self:center}
.row .k{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.row .v{flex:0 1 auto;max-width:62%;text-align:right;color:var(--hint);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.row .v.col{color:var(--c)}

/* graph */
.gcard{padding:8px 4px 6px}
.gsvg{display:block;width:100%;height:auto;margin:0 auto;max-width:560px}
.gsvg text{font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 12px 6px;font-size:12.5px;color:var(--hint)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:8px;overflow:visible}

/* timeline */
.strip{display:grid;gap:5px}
.sday{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.sbox{position:relative;width:100%;height:84px;border-radius:7px;background:color-mix(in srgb,var(--text) 6%,transparent);overflow:hidden}
.sday.today .sbox{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 60%,transparent)}
.mark{position:absolute;left:18%;width:64%;min-height:5px;border-radius:3px;background:var(--c)}
.mark.on{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.slab{font-size:11px;line-height:1.1;color:var(--hint);text-align:center;font-variant-numeric:tabular-nums}
.slab b{display:block;font-size:13px;color:var(--text);font-weight:600}
.item{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--sep)}
.item:first-child{border-top:0}
.item .d{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.item .m{flex:1;min-width:0}
.item .t{overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--hint);margin-top:1px;font-variant-numeric:tabular-nums}
.item .du{flex:none;font-size:13px;color:var(--hint);text-align:right;font-variant-numeric:tabular-nums}
.item .du.live{color:var(--c);font-weight:600}
.empty{padding:22px 8px;text-align:center;color:var(--hint)}
.more{padding:8px 0 2px;text-align:center;font-size:13px;color:var(--hint)}


.sday{border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sday.sel .sbox{box-shadow:inset 0 0 0 2px var(--accent)}
.sday.sel .slab b{color:var(--accent)}
.mark.minor{left:34%;width:32%;opacity:.5}
.cnt{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--hint)}
.cnt.has{color:var(--text)}
.legend.tl{padding:10px 2px 2px}
.ld{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c)}
.hint{padding:6px 2px 0;font-size:12px;color:var(--hint)}
.dh{margin-top:12px;padding-bottom:2px;font-size:13px;font-weight:700;color:var(--hint)}
.dh:first-child{margin-top:2px}
.fold{display:block;width:100%;margin-top:4px;padding:9px 10px;border:0;border-radius:9px;text-align:left;font:inherit;font-size:13.5px;color:var(--hint);background:color-mix(in srgb,var(--text) 6%,transparent);cursor:pointer}
.minorlist[hidden]{display:none}
.item .d{margin-top:6px}

/* bars */
.bhead{font-size:16px;font-weight:700;margin:6px 4px 0}
.bar{padding:11px 0;border-top:1px solid var(--sep)}
.bar:first-child{border-top:0}
.bar .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.bar .nm{overflow-wrap:anywhere;font-weight:600}
.bar .vl{flex:none;font-variant-numeric:tabular-nums;font-weight:600}
.track{position:relative;height:10px;margin:8px 0 6px;border-radius:5px;background:color-mix(in srgb,var(--text) 9%,transparent)}
.fill,.fc{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.fill{background:var(--c)}
.fc{background:color-mix(in srgb,var(--c) 32%,transparent)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:1px;background:var(--c)}
.bar .sub{font-size:13px;color:var(--hint);overflow-wrap:anywhere}
.bar .bn{font-size:12px;color:var(--hint);margin-top:1px;overflow-wrap:anywhere}

/* actions */
.actions{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.actions button{
  border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;
  color:var(--c,var(--btnt));background:color-mix(in srgb,var(--c,var(--btn)) 14%,var(--card));
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c,var(--btn)) 55%,transparent);
}
.actions button.plain{background:var(--btn);color:var(--btnt);box-shadow:none}

/* error */
.err{margin-top:30px;padding:26px 20px;text-align:center}
.err .ic{font-size:34px;line-height:1}
.err .h{margin-top:10px;font-size:18px;font-weight:700}
.err .p{margin-top:6px;color:var(--hint);font-size:14px}

.l-ok{--c:var(--ok)}.l-warn{--c:var(--warn)}.l-bad{--c:var(--bad)}.l-idle{--c:var(--idle)}.l-unk{--c:var(--unk)}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
(function(){
'use strict';
var root=document.getElementById('root');
var LV=['ok','warn','bad','idle','unk'];
function lv(x){return LV.indexOf(x)>=0?x:'unk';}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=String(text);return e;}
var SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,text){var e=document.createElementNS(SVGNS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=String(text);return e;}
function num(x,d){return typeof x==='number'&&isFinite(x)?x:d;}
function str(x){return x==null?'':String(x);}

/* ---------- Telegram bridge ---------- */
function postEvent(name,data){
  try{
    if(window.TelegramWebviewProxy&&window.TelegramWebviewProxy.postEvent){
      window.TelegramWebviewProxy.postEvent(name,JSON.stringify(data||{}));return true;}
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(JSON.stringify({eventType:name,eventData:data||{}}),'*');return true;}
  }catch(e){}
  return false;
}
postEvent('web_app_ready');
postEvent('web_app_expand');

/* ---------- params / theme ---------- */
function getParams(){
  var h=location.hash.replace(/^#/,'');
  var p=new URLSearchParams(h);
  if(!p.has('d')&&!p.has('j')){
    var q=new URLSearchParams(location.search);
    if(q.has('d')||q.has('j'))return q;
  }
  return p;
}
var params=getParams();
function themeParams(){
  var t=null;
  try{var s=params.get('tgWebAppThemeParams');if(s)t=JSON.parse(s);}catch(e){}
  try{if(!t&&window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.themeParams)t=window.Telegram.WebApp.themeParams;}catch(e){}
  return t&&typeof t==='object'?t:null;
}
function lum(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return null;
  var n=parseInt(m[1],16),r=n>>16&255,g=n>>8&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255;
}
function isHex(x){return typeof x==='string'&&/^#[0-9a-f]{6}$/i.test(x);}
function applyTheme(){
  var rs=document.documentElement,t=themeParams(),dark;
  var mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  if(t&&isHex(t.bg_color)){dark=lum(t.bg_color)<0.5;}
  else dark=!!(mq&&mq.matches);
  rs.setAttribute('data-theme',dark?'dark':'light');
  if(t){
    var map={bg_color:null,text_color:'--text',hint_color:'--hint',link_color:'--link',button_color:'--btn',
      button_text_color:'--btnt',accent_text_color:'--accent',section_separator_color:'--sep'};
    for(var k in map){if(map[k]&&isHex(t[k]))rs.style.setProperty(map[k],t[k]);}
    // page = secondary bg, card = section bg (fallback: bg)
    var card=isHex(t.section_bg_color)?t.section_bg_color:(isHex(t.bg_color)?t.bg_color:null);
    var page=isHex(t.secondary_bg_color)?t.secondary_bg_color:(isHex(t.bg_color)?t.bg_color:null);
    if(card)rs.style.setProperty('--card',card);
    if(page)rs.style.setProperty('--page',page);
    if(card&&page&&card.toLowerCase()===page.toLowerCase()){
      rs.style.setProperty('--card','color-mix(in srgb,'+card+' 94%,'+(dark?'#fff':'#000')+')');
    }
    if(isHex(t.section_separator_color)===false)rs.style.removeProperty('--sep');
    // status colours: keep own palette, but allow destructive colour for "bad"
    if(isHex(t.destructive_text_color))rs.style.setProperty('--bad',t.destructive_text_color);
  }
  if(!t&&mq&&mq.addEventListener&&!applyTheme.bound){
    applyTheme.bound=1;mq.addEventListener('change',applyTheme);}
}
applyTheme();

/* ---------- decode ---------- */
function b64u(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/\s/g,'');
  while(s.length%4)s+='=';
  var b=atob(s),u=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return u;
}
async function decode(){
  var d=params.get('d'),j=params.get('j');
  if(d){
    if(typeof DecompressionStream==='undefined')throw new Error('nods');
    var ds=new DecompressionStream('deflate-raw');
    var w=ds.writable.getWriter();w.write(b64u(d)).catch(function(){});w.close().catch(function(){});
    var out=await new Response(ds.readable).arrayBuffer();
    return JSON.parse(new TextDecoder('utf-8').decode(out));
  }
  if(j)return JSON.parse(new TextDecoder('utf-8').decode(b64u(j)));
  throw new Error('none');
}
function showError(){
  root.textContent='';
  var c=el('div','card err');
  c.appendChild(el('div','ic','📭'));
  c.appendChild(el('div','h','Откройте дашборд кнопкой из бота'));
  c.appendChild(el('div','p','Отправьте боту /status и нажмите кнопку под сообщением.'));
  root.appendChild(c);
}

/* ---------- helpers ---------- */
function pad2(n){return n<10?'0'+n:''+n;}
function hhmm(d){return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function dur(min){
  if(min<1)return 'меньше мин';
  if(min<60)return Math.round(min)+' мин';
  var h=Math.floor(min/60),m=Math.round(min%60);
  if(h>=48)return Math.floor(h/24)+' дн';
  return h+' ч'+(m?' '+m+' мин':'');
}
function ago(sec){
  var m=Math.floor(sec/60);
  if(m<1)return 'только что';
  if(m<60)return m+' мин назад';
  return Math.floor(m/60)+' ч '+(m%60)+' мин назад';
}
function wrap(s,n,maxLines){
  var words=str(s).split(/\s+/).filter(Boolean),lines=[],cur='';
  words.forEach(function(w){
    if(!cur)cur=w;
    else if((cur+' '+w).length<=n)cur+=' '+w;
    else{lines.push(cur);cur=w;}
  });
  if(cur)lines.push(cur);
  if(maxLines&&lines.length>maxLines){
    lines=lines.slice(0,maxLines);
    var l=lines[maxLines-1];
    lines[maxLines-1]=(l.length>n-1?l.slice(0,n-1):l)+'…';
  }
  return lines;
}
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- sections ---------- */
function buildStatus(s){
  var f=document.createDocumentFragment();
  var hero=el('div','hero l-'+lv(s.lvl));
  hero.appendChild(el('span','big'));
  hero.appendChild(el('div','head',s.head));
  f.appendChild(hero);
  if(Array.isArray(s.rows)&&s.rows.length){
    var c=el('div','card rows');
    s.rows.forEach(function(r){
      if(!Array.isArray(r))return;
      var row=el('div','row'+(r[2]?' l-'+lv(r[2]):''));
      row.appendChild(el('span','d'));
      row.appendChild(el('span','k',r[0]));
      row.appendChild(el('span','v'+(r[2]?' col':''),r[1]));
      c.appendChild(row);
    });
    f.appendChild(c);
  }
  if(s.note)f.appendChild(el('p','note',s.note));
  return f;
}

var graphSvg=null;
function buildGraph(g){
  var f=document.createDocumentFragment();
  var nodes=(g.nodes||[]).filter(function(n){return n&&n.id!=null;});
  var byId={};nodes.forEach(function(n){byId[n.id]=n;});
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  nodes.forEach(function(n){var x=num(n.x,0),y=num(n.y,0);
    minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  if(!nodes.length){minX=maxX=minY=maxY=0;}
  minX=Math.min(minX,0);minY=Math.min(minY,0);
  maxX=Math.max(maxX,num(g.w,1)-1);maxY=Math.max(maxY,num(g.h,1)-1);
  var spanX=maxX-minX;
  var vertical=spanX<0.5;
  var W=360,R,ux,uy,padX,padT,H,P={};
  if(vertical){
    R=22;uy=96;padT=34;
    H=padT+(maxY-minY)*uy+46;
    nodes.forEach(function(n){P[n.id]=[40,padT+(num(n.y,0)-minY)*uy];});
    ux=uy*0.6;
  }else{
    R=19;padX=34;padT=34;
    ux=(W-2*padX)/spanX;uy=88;
    H=padT+(maxY-minY)*uy+88;
    nodes.forEach(function(n){P[n.id]=[padX+(num(n.x,0)-minX)*ux,padT+(num(n.y,0)-minY)*uy];});
  }
  var svg=sv('svg',{viewBox:'0 0 '+W+' '+Math.round(H),'class':'gsvg',role:'img','aria-label':'Схема'});
  var gE=sv('g',{}),gD=sv('g',{}),gN=sv('g',{});
  svg.appendChild(gE);svg.appendChild(gD);svg.appendChild(gN);

  (g.edges||[]).forEach(function(e){
    var A=byId[e.a],B=byId[e.b];if(!A||!B)return;
    var p0=P[A.id],p1=P[B.id],st=lv(e.st),on=!!e.on;
    var dx=p1[0]-p0[0],dy=p1[1]-p0[1],L=Math.hypot(dx,dy)||1;
    var bend=num(e.bend,0)*ux;
    var cx=(p0[0]+p1[0])/2+dy/L*bend*2,cy=(p0[1]+p1[1])/2-dx/L*bend*2;
    function norm(x,y){var l=Math.hypot(x,y)||1;return [x/l,y/l];}
    var d0=norm(cx-p0[0],cy-p0[1]),d1=norm(p1[0]-cx,p1[1]-cy),gap=R+3;
    var sx=p0[0]+d0[0]*gap,sy=p0[1]+d0[1]*gap,ex=p1[0]-d1[0]*gap,ey=p1[1]-d1[1]*gap;
    var path='M'+sx.toFixed(1)+' '+sy.toFixed(1)+' Q'+cx.toFixed(1)+' '+cy.toFixed(1)+' '+ex.toFixed(1)+' '+ey.toFixed(1);
    var col='var(--'+st+')';
    var attrs={d:path,fill:'none','stroke-linecap':'round',stroke:col};
    if(st==='idle'||!on&&st==='unk'){
      attrs['stroke-width']='1.6';attrs['stroke-dasharray']='4 5';attrs.opacity='.7';
    }else if(on){attrs['stroke-width']='2.2';attrs.opacity='.9';}
    else{attrs['stroke-width']='1.8';attrs.opacity='.8';}
    gE.appendChild(sv('path',attrs));
    if(on&&!reduce){
      var len=Math.hypot(ex-sx,ey-sy)+Math.abs(bend);
      var dd=Math.max(1.8,len/55),cnt=vertical?2:2;
      for(var i=0;i<cnt;i++){
        var c=sv('circle',{r:vertical?3.2:2.8,fill:col});
        var am=sv('animateMotion',{dur:dd.toFixed(2)+'s',repeatCount:'indefinite',path:path,begin:(-i*dd/cnt).toFixed(2)+'s',
          calcMode:'linear'});
        c.appendChild(am);gD.appendChild(c);
      }
    }
    if(e.label){
      var tx=0.25*sx+0.5*cx+0.25*ex,ty=0.25*sy+0.5*cy+0.25*ey;
      var ls=wrap(e.label,vertical?36:18,vertical?3:2);
      var t=sv('text',{x:vertical?tx+14:tx,y:ty-(vertical?0:6)-(ls.length-1)*(vertical?7:5),
        'text-anchor':vertical?'start':'middle','font-size':vertical?11.5:8.5,fill:'var(--hint)','font-style':'italic',
        stroke:'var(--card)','stroke-width':3,'paint-order':'stroke','stroke-linejoin':'round'});
      ls.forEach(function(l,i){var ts=sv('tspan',{x:vertical?tx+14:tx,dy:i?(vertical?14:10):0},l);t.appendChild(ts);});
      gD.appendChild(t);
    }
  });

  nodes.forEach(function(n){
    var p=P[n.id],st=lv(n.st),col='var(--'+st+')';
    var grp=sv('g',{});
    grp.appendChild(sv('circle',{cx:p[0],cy:p[1],r:R,fill:'var(--card)',stroke:col,'stroke-width':st==='idle'?1.6:2.4,
      'stroke-dasharray':st==='idle'?'3 3':'none'}));
    grp.appendChild(sv('circle',{cx:p[0],cy:p[1],r:R-2,fill:col,opacity:st==='idle'?.08:.14}));
    var ic=sv('text',{x:p[0],y:p[1]+1,'text-anchor':'middle','dominant-baseline':'central','font-size':R*0.95},n.icon||'●');
    grp.appendChild(ic);
    grp.appendChild(sv('circle',{cx:p[0]+R*0.72,cy:p[1]-R*0.72,r:4.2,fill:col,stroke:'var(--card)','stroke-width':1.8}));
    if(vertical){
      var tx=p[0]+R+16;
      var lab=sv('text',{x:tx,y:p[1]-(n.sub?3:-5),'font-size':16,'font-weight':700,fill:'var(--text)'},n.label);
      grp.appendChild(lab);
      var sl=wrap(n.sub,36,2);
      if(sl.length){
        var s=sv('text',{x:tx,y:p[1]+13,'font-size':12.5,fill:'var(--hint)'});
        sl.forEach(function(l,i){s.appendChild(sv('tspan',{x:tx,dy:i?15:0},l));});
        grp.appendChild(s);
      }
    }else{
      var ll=wrap(n.label,12,2);
      var y=p[1]+R+13;
      var lab2=sv('text',{x:p[0],y:y,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'var(--text)'});
      ll.forEach(function(l,i){lab2.appendChild(sv('tspan',{x:p[0],dy:i?12:0},l));});
      grp.appendChild(lab2);
      var sl2=wrap(n.sub,13,3);
      if(sl2.length){
        var yy=y+(ll.length-1)*12+11;
        var s2=sv('text',{x:p[0],y:yy,'text-anchor':'middle','font-size':9,fill:'var(--hint)'});
        sl2.forEach(function(l,i){s2.appendChild(sv('tspan',{x:p[0],dy:i?10.5:0},l));});
        grp.appendChild(s2);
      }
    }
    gN.appendChild(grp);
  });

  var card=el('div','card gcard');
  card.appendChild(svg);
  graphSvg=svg;
  if(Array.isArray(g.legend)&&g.legend.length){
    var lg=el('div','legend');
    g.legend.forEach(function(it){
      if(!Array.isArray(it))return;
      var k=it[0],sp=el('span');
      var s=sv('svg',{'class':'sw',viewBox:'0 0 22 8'});
      if(k==='on'){
        s.appendChild(sv('line',{x1:1,y1:4,x2:21,y2:4,stroke:'var(--ok)','stroke-width':2.2,'stroke-linecap':'round'}));
        s.appendChild(sv('circle',{cx:14,cy:4,r:3,fill:'var(--ok)'}));
      }else if(k==='idle'){
        s.appendChild(sv('line',{x1:1,y1:4,x2:21,y2:4,stroke:'var(--idle)','stroke-width':1.8,'stroke-dasharray':'4 4','stroke-linecap':'round'}));
      }else{
        s.appendChild(sv('line',{x1:1,y1:4,x2:21,y2:4,stroke:'var(--'+lv(k)+')','stroke-width':2.2,'stroke-linecap':'round'}));
      }
      sp.appendChild(s);sp.appendChild(document.createTextNode(str(it[1])));
      lg.appendChild(sp);
    });
    card.appendChild(lg);
  }
  f.appendChild(card);
  if(g.note)f.appendChild(el('p','note',g.note));
  return f;
}

function buildTimeline(t){
  var f=document.createDocumentFragment();
  var days=Math.max(1,Math.min(14,Math.round(num(t.days,7))));
  var items=(t.items||[]).filter(function(i){return i&&typeof i.ts==='number';});
  var now=Date.now();
  var today=new Date(now);today.setHours(0,0,0,0);
  function dayStart(ms){var d=new Date(ms);d.setHours(0,0,0,0);return d.getTime();}
  var sel=null,open={};
  var stripCard=el('div','card'),listCard=el('div','card');
  var cols=[];
  for(var i=days-1;i>=0;i--){var d0=new Date(today);d0.setDate(d0.getDate()-i);cols.push({start:d0.getTime(),d:d0,n:0});}
  items.forEach(function(it){var s=dayStart(it.ts*1000);cols.forEach(function(c){if(c.start===s)c.n++;});});

  function drawStrip(){
    stripCard.textContent='';
    var strip=el('div','strip');strip.style.gridTemplateColumns='repeat('+days+',minmax(0,1fr))';
    cols.forEach(function(c,idx){
      var day=el('button','sday'+(idx===cols.length-1?' today':'')+(sel===c.start?' sel':''));
      day.type='button';day.setAttribute('aria-pressed',sel===c.start?'true':'false');
      var box=el('div','sbox');
      var nd=new Date(c.start);nd.setDate(nd.getDate()+1);var de=nd.getTime(),ds=c.start;
      items.forEach(function(it){
        var st=it.ts*1000,en=it.min<0?now:st+Math.max(0,num(it.min,0))*60000;
        var a=Math.max(st,ds),b=Math.min(en,de);
        if(st>=de||en<ds||b<a)return;
        var m=el('div','mark l-'+lv(it.lvl)+(it.minor?' minor':'')+(it.min<0?' on':''));
        m.style.top=((a-ds)/(de-ds)*100).toFixed(2)+'%';
        m.style.height=((b-a)/(de-ds)*100).toFixed(2)+'%';
        box.appendChild(m);
      });
      var lab=el('div','slab');
      lab.appendChild(el('b',null,c.d.getDate()));
      lab.appendChild(document.createTextNode(c.d.toLocaleDateString('ru-RU',{weekday:'short'})));
      lab.appendChild(el('span','cnt'+(c.n?' has':''),c.n?c.n:'—'));
      day.appendChild(box);day.appendChild(lab);
      day.addEventListener('click',function(){sel=(sel===c.start)?null:c.start;drawStrip();drawList();});
      strip.appendChild(day);
    });
    stripCard.appendChild(strip);
    if(Array.isArray(t.legend)&&t.legend.length){
      var lg=el('div','legend tl');
      t.legend.forEach(function(it){
        if(!Array.isArray(it))return;
        var sp=el('span','l-'+lv(it[0]));sp.appendChild(el('i','ld'));sp.appendChild(document.createTextNode(str(it[1])));lg.appendChild(sp);
      });
      stripCard.appendChild(lg);
    }
    stripCard.appendChild(el('div','hint','Нажмите на день, чтобы оставить только его'));
  }
  function dayLabel(ms){
    var diff=Math.round((today.getTime()-ms)/86400000);
    if(diff===0)return 'Сегодня';if(diff===1)return 'Вчера';
    var d=new Date(ms);
    return d.toLocaleDateString('ru-RU',{weekday:'short'})+', '+pad2(d.getDate())+'.'+pad2(d.getMonth()+1);
  }
  function itemRow(it){
    var row=el('div','item l-'+lv(it.lvl));
    row.appendChild(el('span','d'));
    var m=el('div','m');
    m.appendChild(el('div','t',it.text));
    var s=new Date(it.ts*1000),tr=hhmm(s);
    if(it.min<0)tr+=' – сейчас';
    else if(num(it.min,0)>0)tr+='–'+hhmm(new Date(it.ts*1000+it.min*60000));
    m.appendChild(el('div','s',(it.who?it.who+' · ':'')+tr));
    row.appendChild(m);
    if(it.min<0)row.appendChild(el('div','du live','идёт сейчас'));
    else if(num(it.min,0)>0)row.appendChild(el('div','du',dur(it.min)));
    return row;
  }
  function drawList(){
    listCard.textContent='';
    var groups={},keys=[];
    items.forEach(function(it){var k=dayStart(it.ts*1000);if(!groups[k]){groups[k]=[];keys.push(k);}groups[k].push(it);});
    keys.sort(function(a,b){return b-a;});
    if(sel!==null)keys=keys.filter(function(k){return k===sel;});
    if(!keys.length){
      listCard.appendChild(el('div','empty',sel!==null?'В этот день сбоев не было':(t.empty||'Сбоев нет')));
    }
    keys.forEach(function(k){
      listCard.appendChild(el('div','dh',dayLabel(k)));
      var arr=groups[k].slice().sort(function(a,b){return b.ts-a.ts;});
      var major=arr.filter(function(i){return !i.minor;}),minor=arr.filter(function(i){return i.minor;});
      major.forEach(function(it){listCard.appendChild(itemRow(it));});
      if(minor.length){
        var box=el('div','minorbox');
        var btn=el('button','fold');btn.type='button';
        var wrapEl=el('div','minorlist');wrapEl.hidden=!open[k];
        minor.forEach(function(it){wrapEl.appendChild(itemRow(it));});
        function lab(){btn.textContent=(open[k]?'− ':'+ ')+minor.length+' '+(t.minor_label||'коротких');btn.setAttribute('aria-expanded',open[k]?'true':'false');}
        lab();
        btn.addEventListener('click',function(){open[k]=!open[k];wrapEl.hidden=!open[k];lab();});
        box.appendChild(btn);box.appendChild(wrapEl);listCard.appendChild(box);
      }
    });
    if(num(t.more,0)>0)listCard.appendChild(el('div','more','ещё '+t.more+' сбоев раньше не поместилось'));
  }
  drawStrip();drawList();
  f.appendChild(stripCard);f.appendChild(listCard);
  return f;
}

function buildBars(b){
  var f=document.createDocumentFragment();
  if(b.head)f.appendChild(el('div','bhead',b.head));
  var c=el('div','card');
  (b.rows||[]).forEach(function(r){
    var row=el('div','bar l-'+lv(r.lvl));
    var top=el('div','top');
    top.appendChild(el('span','nm',r.name));
    top.appendChild(el('span','vl',r.val));
    row.appendChild(top);
    var pct=typeof r.pct==='number'?Math.max(0,Math.min(100,r.pct)):null;
    var fp=typeof r.fpct==='number'?Math.max(0,Math.min(100,r.fpct)):null;
    var tr=el('div','track');
    if(fp!=null&&(pct==null||fp>pct)){var fc=el('div','fc');fc.style.width=fp+'%';tr.appendChild(fc);}
    if(pct!=null){var fl=el('div','fill');fl.style.width=pct+'%';tr.appendChild(fl);}
    if(fp!=null){var tk=el('div','tick');tk.style.left=fp+'%';tr.appendChild(tk);}
    row.appendChild(tr);
    if(r.sub)row.appendChild(el('div','sub',r.sub));
    if(r.note)row.appendChild(el('div','bn',r.note));
    c.appendChild(row);
  });
  f.appendChild(c);
  if(b.foot)f.appendChild(el('p','note',b.foot));
  return f;
}

function buildActions(list){
  var box=el('div','actions');
  list.forEach(function(a){
    if(!a||!a.link)return;
    var b=el('button',a.lvl?'l-'+lv(a.lvl):'plain',a.label||a.link);
    b.type='button';
    b.addEventListener('click',function(){
      var link=str(a.link),m=/^https:\/\/t\.me(\/.*)$/i.exec(link);
      if(m&&postEvent('web_app_open_tg_link',{path_full:m[1]}))return;
      if(/^https:\/\//i.test(link))window.open(link,'_blank','noopener');
    });
    box.appendChild(b);
  });
  return box;
}

/* ---------- main ---------- */
var FALLBACK={status:'Статус',graph:'Схема',timeline:'История',bars:'Трафик'};
var BUILD={status:buildStatus,graph:buildGraph,timeline:buildTimeline,bars:buildBars};

function render(P){
  root.textContent='';
  var hdr=el('header');
  hdr.appendChild(el('h1',null,P.title||'Дашборд'));
  var fr=el('div','fresh');hdr.appendChild(fr);
  root.appendChild(hdr);
  if(P.title)document.title=String(P.title);
  var stale=el('div','stalebox','Снимок устарел — отправьте /status, чтобы обновить');
  stale.hidden=true;root.appendChild(stale);
  var g=num(P.g,0);
  function fresh(){
    if(!g){fr.textContent='';return;}
    var sec=Math.max(0,Date.now()/1000-g);
    fr.textContent='данные на '+hhmm(new Date(g*1000))+' · '+ago(sec);
    var st=sec>600;
    fr.className='fresh'+(st?' stale':'');stale.hidden=!st;
  }
  fresh();
  setInterval(function(){if(!document.hidden)fresh();},30000);

  var order=(Array.isArray(P.tabs)?P.tabs:Object.keys(BUILD)).filter(function(k){return BUILD[k]&&P[k]&&typeof P[k]==='object';});
  var names=P.names&&typeof P.names==='object'?P.names:{};
  var secs={},btns={},built={},cur=null;
  var bar=el('div','tabsbar'),tabs=el('div','tabs');tabs.setAttribute('role','tablist');
  order.forEach(function(k){
    var b=el('button',null,names[k]||FALLBACK[k]);
    b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected','false');
    b.addEventListener('click',function(){show(k);});
    tabs.appendChild(b);btns[k]=b;
  });
  bar.appendChild(tabs);
  if(order.length>1)root.appendChild(bar);
  order.forEach(function(k){var s=el('section');s.hidden=true;s.setAttribute('role','tabpanel');secs[k]=s;root.appendChild(s);});
  if(!order.length){root.appendChild(el('div','card empty','Нет данных для показа'));}
  if(Array.isArray(P.actions)&&P.actions.length)root.appendChild(buildActions(P.actions));

  function anim(){
    if(graphSvg&&graphSvg.pauseAnimations){
      if(cur==='graph'&&!document.hidden)graphSvg.unpauseAnimations();else graphSvg.pauseAnimations();
    }
  }
  function show(k){
    cur=k;
    order.forEach(function(o){
      var on=o===k;secs[o].hidden=!on;btns[o].setAttribute('aria-selected',on?'true':'false');
    });
    if(!built[k]){
      built[k]=1;
      try{secs[k].appendChild(BUILD[k](P[k]));}catch(e){secs[k].appendChild(el('div','card empty','Не удалось показать раздел'));}
    }
    anim();
    window.scrollTo(0,0);
  }
  document.addEventListener('visibilitychange',function(){anim();if(!document.hidden)fresh();});
  if(order.length)show(order[0]);
}

decode().then(function(P){
  if(!P||typeof P!=='object'||P.v!==1)throw new Error('v');
  render(P);
}).catch(function(){showError();});
})();
</script>
